name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Localized output and vendored SDK are reproducible
        run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify static production container
        if: matrix.node == 24
        run: |
          docker build -t stitchloom:test .
          docker run --detach --name stitchloom-smoke -p 127.0.0.1:8080:80 stitchloom:test
          trap 'docker logs stitchloom-smoke; docker rm -f stitchloom-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = ok
          for locale in ru en es de; do
            curl -fsS "http://127.0.0.1:8080/$locale/" > locale.html
            grep -q "lang=\"$locale\"" locale.html
          done
          curl -fsS http://127.0.0.1:8080/project-format.js >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing-file.js)" = 404
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
