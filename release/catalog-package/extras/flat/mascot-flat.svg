<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Упрощённый маскот Stitchloom</title>
  <desc id="desc">Плоская катушка ниток с иглой, лицом и крестиками. Все тени выполнены отдельными фигурами без градиентов.</desc>

  <!-- Thread loop: one base colour, no gradient. -->
  <path d="M718 304C900 194 943 354 807 433C713 488 741 622 874 616C944 613 966 558 930 526"
        fill="none" stroke="#FF614F" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Legs and shoes. -->
  <path d="M443 783L427 893M589 783L606 893" fill="none" stroke="#202A47" stroke-width="42" stroke-linecap="round"/>
  <ellipse cx="396" cy="912" rx="82" ry="43" fill="#202A47"/>
  <ellipse cx="636" cy="912" rx="82" ry="43" fill="#202A47"/>
  <path d="M330 914C355 892 403 882 465 900C452 939 334 950 330 914Z" fill="#313B5E"/>
  <path d="M566 900C628 882 677 892 702 914C698 950 580 939 566 900Z" fill="#313B5E"/>

  <!-- Spool body and one hard side-shadow region. -->
  <path d="M289 248C282 368 291 633 315 773C377 820 645 820 707 773C731 633 740 368 733 248Z" fill="#FF614F"/>
  <path d="M650 259C687 380 681 650 646 786C680 781 700 772 707 763C731 625 740 371 733 248Z" fill="#DE3E3A"/>

  <!-- Hard thread bands: one darker colour transition. -->
  <path d="M297 356C403 393 583 385 724 333L722 383C573 430 410 434 299 401Z" fill="#E84940"/>
  <path d="M303 516C418 553 591 547 718 494L716 544C580 593 417 598 306 561Z" fill="#E84940"/>
  <path d="M312 675C431 716 587 706 710 655L706 708C574 754 423 759 316 720Z" fill="#E84940"/>

  <!-- Wooden top rim: base plus one hard shadow. -->
  <path d="M241 231C252 173 359 135 510 135C662 135 770 173 781 231V278C749 336 659 358 510 358C361 358 272 336 241 278Z" fill="#DDA35F"/>
  <ellipse cx="511" cy="224" rx="270" ry="96" fill="#FFD797"/>
  <path d="M241 224C260 267 367 296 511 296C655 296 762 267 781 224V274C748 327 654 346 511 346C368 346 274 327 241 274Z" fill="#E8AF6A"/>
  <ellipse cx="511" cy="215" rx="104" ry="38" fill="#8B552F"/>
  <ellipse cx="511" cy="205" rx="83" ry="23" fill="#6F4028"/>

  <!-- Wooden bottom rim: base plus one hard shadow. -->
  <path d="M275 752C314 712 391 696 511 696C631 696 708 712 747 752V804C715 861 627 885 511 885C395 885 307 861 275 804Z" fill="#DDA35F"/>
  <ellipse cx="511" cy="758" rx="236" ry="76" fill="#FFD797"/>
  <path d="M276 758C309 798 396 815 511 815C626 815 713 798 746 758V802C714 850 627 870 511 870C395 870 308 850 276 802Z" fill="#E8AF6A"/>

  <!-- Face. -->
  <path d="M353 430C386 397 431 394 461 424" fill="none" stroke="#202A47" stroke-width="25" stroke-linecap="round"/>
  <path d="M559 424C589 394 635 397 668 430" fill="none" stroke="#202A47" stroke-width="25" stroke-linecap="round"/>
  <ellipse cx="411" cy="501" rx="64" ry="78" fill="#FFF8EB"/>
  <ellipse cx="611" cy="501" rx="64" ry="78" fill="#FFF8EB"/>
  <ellipse cx="427" cy="510" rx="34" ry="48" fill="#18233E"/>
  <ellipse cx="595" cy="510" rx="34" ry="48" fill="#18233E"/>
  <circle cx="437" cy="493" r="11" fill="#FFF8EB"/>
  <circle cx="584" cy="493" r="11" fill="#FFF8EB"/>
  <path d="M456 582C487 607 536 607 567 582C567 642 456 642 456 582Z" fill="#202A47"/>
  <path d="M482 618C500 601 524 601 542 618C525 634 499 634 482 618Z" fill="#FF8069"/>

  <!-- Arms and hands: base plus one hard highlight region. -->
  <path d="M305 566C239 579 226 653 280 684C320 706 357 667 374 626" fill="none" stroke="#202A47" stroke-width="47" stroke-linecap="round"/>
  <circle cx="374" cy="615" r="43" fill="#202A47"/>
  <path d="M708 548C773 557 784 638 733 676" fill="none" stroke="#202A47" stroke-width="47" stroke-linecap="round"/>
  <circle cx="710" cy="549" r="43" fill="#313B5E"/>

  <!-- Needle uses two flat regions. -->
  <path d="M714 561L775 333" fill="none" stroke="#F4F1E8" stroke-width="17" stroke-linecap="round"/>
  <path d="M725 557L785 337" fill="none" stroke="#AEB9C2" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="780" cy="326" rx="17" ry="28" fill="none" stroke="#F4F1E8" stroke-width="12" transform="rotate(15 780 326)"/>

  <!-- Cross-stitches remain large enough at 64 px. -->
